<!DOCTYPE html>
<html lang="en" data-theme="portal" data-mode="light" data-layout="phone">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Hermes Bot — theme prototypes</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500&family=Newsreader:opsz,wght@6..72,400;6..72,600&display=swap"
      rel="stylesheet"
    />
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ["var(--font-sans)"],
              mono: ["var(--font-mono)"],
              display: ["var(--font-display)"],
            },
            borderRadius: {
              theme: "var(--radius)",
              chip: "var(--radius-chip)",
            },
            colors: {
              bg: "var(--bg)",
              chrome: "var(--chrome)",
              sidebar: "var(--sidebar)",
              elevated: "var(--elevated)",
              hair: "var(--hair)",
              ink: "var(--ink)",
              mute: "var(--mute)",
              dim: "var(--dim)",
              accent: "var(--accent)",
              cream: "var(--cream)",
              warn: "var(--warn)",
            },
            boxShadow: {
              nous: "var(--shadow-nous)",
            },
          },
        },
      };
    </script>
    <style>
      html[data-mode="light"] {
        color-scheme: light;
      }
      html[data-mode="dark"] {
        color-scheme: dark;
      }

      [data-theme="psyche"] {
        --radius: 4px;
        --radius-chip: 999px;
        --font-sans: "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif;
        --font-mono: "IBM Plex Mono", ui-monospace, monospace;
        --font-display: "Instrument Serif", "IBM Plex Sans", serif;
      }
      [data-theme="psyche"][data-mode="light"] {
        --bg: #f8faff;
        --chrome: #ffffff;
        --sidebar: #f4f7ff;
        --elevated: #e8f0ff;
        --hair: color-mix(in srgb, #0053fd 12%, #dce6f6);
        --ink: #0e2766;
        --mute: #3d4f7a;
        --dim: #6b7785;
        --accent: #0053fd;
        --cream: #0e2766;
        --warn: #c47b00;
        --shadow-nous: 0 1px 2px color-mix(in srgb, #0053fd 8%, transparent),
          0 12px 28px -16px color-mix(in srgb, #0e2766 14%, transparent);
        --statue: none;
      }
      [data-theme="psyche"][data-mode="dark"] {
        --bg: #081633;
        --chrome: #0a1a3d;
        --sidebar: #07122c;
        --elevated: #0e2766;
        --hair: color-mix(in srgb, #ffe6cb 12%, transparent);
        --ink: #ffe6cb;
        --mute: color-mix(in srgb, #ffe6cb 68%, #0e2766);
        --dim: color-mix(in srgb, #ffe6cb 42%, #0e2766);
        --accent: #0053fd;
        --cream: #ffe6cb;
        --warn: #ffd24a;
        --shadow-nous: 0 2px 8px color-mix(in srgb, #000 18%, transparent),
          0 16px 32px -20px color-mix(in srgb, #000 40%, transparent);
        --statue: radial-gradient(120% 80% at 80% 120%, #0053fd22, transparent 50%);
      }

      [data-theme="portal"] {
        --radius: 8px;
        --radius-chip: 999px;
        --font-sans: "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif;
        --font-mono: "IBM Plex Mono", ui-monospace, monospace;
        --font-display: "IBM Plex Sans", sans-serif;
      }
      [data-theme="portal"][data-mode="light"] {
        --bg: #e8f2fd;
        --chrome: #f8faff;
        --sidebar: #f4f8fe;
        --elevated: #ffffff;
        --hair: color-mix(in srgb, #0053fd 14%, #d5e4f6);
        --ink: #170d02;
        --mute: #3d4a5c;
        --dim: #6b7785;
        --accent: #0053fd;
        --cream: #170d02;
        --warn: #c47b00;
        --shadow-nous: 0 1px 2px color-mix(in srgb, #0053fd 8%, transparent),
          0 12px 28px -16px color-mix(in srgb, #0053fd 22%, transparent);
        --statue: none;
      }
      [data-theme="portal"][data-mode="dark"] {
        --bg: #071018;
        --chrome: #0b1520;
        --sidebar: #050d14;
        --elevated: #122033;
        --hair: color-mix(in srgb, #8eb6ff 16%, transparent);
        --ink: #e8f2fd;
        --mute: #9bb0c8;
        --dim: #6b8299;
        --accent: #4d8bff;
        --cream: #e8f2fd;
        --warn: #ffd24a;
        --shadow-nous: 0 2px 10px color-mix(in srgb, #000 40%, transparent);
        --statue: none;
      }

      [data-theme="teal"] {
        --radius: 8px;
        --radius-chip: 999px;
        --font-sans: ui-sans-serif, system-ui, "Segoe UI", sans-serif;
        --font-mono: "JetBrains Mono", ui-monospace, monospace;
        --font-display: ui-sans-serif, system-ui, sans-serif;
      }
      [data-theme="teal"][data-mode="light"] {
        --bg: #f6f1e6;
        --chrome: #fffaf0;
        --sidebar: #f3ece0;
        --elevated: #ffffff;
        --hair: color-mix(in srgb, #041c1c 12%, #e5d8c4);
        --ink: #041c1c;
        --mute: #4a5a52;
        --dim: #7a6b58;
        --accent: #0d4a44;
        --cream: #041c1c;
        --warn: #b45309;
        --shadow-nous: 0 10px 28px -18px color-mix(in srgb, #041c1c 22%, transparent);
        --statue: none;
      }
      [data-theme="teal"][data-mode="dark"] {
        --bg: #041c1c;
        --chrome: #062424;
        --sidebar: #031616;
        --elevated: #0a2a2a;
        --hair: color-mix(in srgb, #ffe6cb 10%, transparent);
        --ink: #fff6ea;
        --mute: #c9b39a;
        --dim: #8a7764;
        --accent: #ffe6cb;
        --cream: #ffe6cb;
        --warn: #ffbd38;
        --shadow-nous: 0 2px 10px color-mix(in srgb, #000 35%, transparent);
        --statue: radial-gradient(90% 60% at 10% 0%, rgba(255, 189, 56, 0.12), transparent 55%);
      }

      [data-theme="mono"] {
        --radius: 0px;
        --radius-chip: 0px;
        --font-sans: "IBM Plex Sans", ui-sans-serif, sans-serif;
        --font-mono: "IBM Plex Mono", ui-monospace, monospace;
        --font-display: "IBM Plex Mono", ui-monospace, monospace;
      }
      [data-theme="mono"][data-mode="light"] {
        --bg: #f4f4f4;
        --chrome: #ffffff;
        --sidebar: #f0f0f0;
        --elevated: #ffffff;
        --hair: #d4d4d4;
        --ink: #0e0e0e;
        --mute: #525252;
        --dim: #737373;
        --accent: #0e0e0e;
        --cream: #0e0e0e;
        --warn: #a16207;
        --shadow-nous: 0 0 0 1px #d4d4d4;
        --statue: none;
      }
      [data-theme="mono"][data-mode="dark"] {
        --bg: #0e0e0e;
        --chrome: #0d0d0e;
        --sidebar: #0a0a0b;
        --elevated: #161618;
        --hair: color-mix(in srgb, #fff 10%, transparent);
        --ink: #eaeaea;
        --mute: #9a9a9a;
        --dim: #6a6a6a;
        --accent: #eaeaea;
        --cream: #eaeaea;
        --warn: #ffd24a;
        --shadow-nous: 0 0 0 1px color-mix(in srgb, #fff 10%, transparent);
        --statue: none;
      }

      [data-theme="ember"] {
        --radius: 4px;
        --radius-chip: 4px;
        --font-sans: "Newsreader", Georgia, serif;
        --font-mono: "IBM Plex Mono", ui-monospace, monospace;
        --font-display: "Newsreader", Georgia, serif;
      }
      [data-theme="ember"][data-mode="light"] {
        --bg: #fff4eb;
        --chrome: #fffaf6;
        --sidebar: #fde8d6;
        --elevated: #ffffff;
        --hair: color-mix(in srgb, #c2410c 14%, #f0d4c0);
        --ink: #1a0a06;
        --mute: #6b3d28;
        --dim: #8a6a4e;
        --accent: #c2410c;
        --cream: #1a0a06;
        --warn: #c2410c;
        --shadow-nous: 0 14px 32px -22px color-mix(in srgb, #c2410c 28%, transparent);
        --statue: none;
      }
      [data-theme="ember"][data-mode="dark"] {
        --bg: #1a0a06;
        --chrome: #220d08;
        --sidebar: #140705;
        --elevated: #2a100a;
        --hair: color-mix(in srgb, #ffd8b0 12%, transparent);
        --ink: #ffd8b0;
        --mute: #c9a07a;
        --dim: #8a6a4e;
        --accent: #f97316;
        --cream: #ffd8b0;
        --warn: #f97316;
        --shadow-nous: 0 18px 40px -24px color-mix(in srgb, #f97316 35%, transparent);
        --statue: radial-gradient(80% 50% at 100% 0%, rgba(249, 115, 22, 0.16), transparent 50%);
      }

      html,
      body {
        background: var(--bg);
        color: var(--ink);
        font-family: var(--font-sans);
        min-height: 100%;
      }

      body {
        background-image: var(--statue);
      }

      .hair {
        border-color: var(--hair);
      }

      .face {
        width: 2.25rem;
        height: 2.25rem;
        flex-shrink: 0;
      }

      .scan::after {
        content: "";
        display: block;
        width: 3px;
        height: 3px;
        border-radius: 99px;
        background: var(--ink);
        box-shadow: 8px 0 0 var(--ink);
        margin: 14px auto 0;
        animation: blink 2.4s steps(1) infinite;
      }

      @keyframes blink {
        0%,
        86% {
          opacity: 1;
        }
        87%,
        92% {
          opacity: 0;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .scan::after {
          animation: none;
        }
      }

      .iphone-stage {
        display: flex;
        justify-content: center;
        padding: 28px 16px 40px;
      }

      /* iPhone 16 logical points — 393 × 852 */
      .iphone {
        width: 393px;
        height: 852px;
        padding: 11px;
        border-radius: 56px;
        background: #0a0a0a;
        box-shadow:
          0 0 0 1px #2a2a2a,
          0 24px 60px -20px color-mix(in srgb, #000 55%, transparent);
      }

      .iphone-screen {
        position: relative;
        display: flex;
        flex-direction: column;
        height: 100%;
        overflow: hidden;
        border-radius: 46px;
        background: var(--bg);
      }

      .status-bar {
        display: grid;
        grid-template-columns: 1fr auto 1fr;
        align-items: center;
        height: 54px;
        padding: 14px 28px 0;
        font-family: var(--font-sans);
        font-size: 15px;
        font-weight: 600;
        letter-spacing: -0.02em;
      }

      .island {
        width: 118px;
        height: 34px;
        border-radius: 20px;
        background: #000;
      }

      .home-ind {
        position: absolute;
        bottom: 8px;
        left: 50%;
        width: 128px;
        height: 5px;
        border-radius: 99px;
        background: color-mix(in srgb, var(--ink) 35%, transparent);
        transform: translateX(-50%);
      }

      .icon-btn {
        display: grid;
        place-items: center;
        width: 36px;
        height: 36px;
        flex-shrink: 0;
        border-radius: 999px;
        color: var(--ink);
      }
      .icon-btn.plus {
        background: var(--elevated);
      }
      .icon-btn.send {
        background: var(--accent);
        color: var(--bg);
      }
      .icon-btn.mic {
        background: var(--elevated);
      }
      .icon-btn.rec {
        background: var(--warn);
        color: var(--bg);
      }
      .icon-btn svg,
      .tool-row svg,
      .sheet button.row svg,
      .computer-bar svg,
      .attach-chip svg {
        width: 18px;
        height: 18px;
        flex-shrink: 0;
        stroke: currentColor;
        fill: none;
        stroke-width: 1.8;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .tool-row svg,
      .computer-bar svg,
      .attach-chip svg {
        width: 14px;
        height: 14px;
      }
      .composer-pill {
        display: flex;
        align-items: flex-end;
        gap: 8px;
        padding: 6px;
        border: 1px solid var(--hair);
        background: var(--elevated);
        border-radius: 24px;
      }
      .composer-pill textarea {
        flex: 1;
        min-height: 36px;
        max-height: 96px;
        margin: 0;
        padding: 8px 4px;
        resize: none;
        border: 0;
        background: transparent;
        color: var(--ink);
        font-size: 17px;
        line-height: 1.25;
        outline: none;
      }
      .rec-bar {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 0 8px 6px;
        font-family: var(--font-mono);
        font-size: 11px;
        color: var(--warn);
      }
      .rec-bar i {
        width: 6px;
        height: 6px;
        border-radius: 99px;
        background: var(--warn);
        animation: blink 1s steps(1) infinite;
      }
      .tool-row {
        display: flex;
        align-items: center;
        gap: 8px;
        font-family: var(--font-mono);
        font-size: 11px;
        color: var(--dim);
      }
      .tool-row b {
        font-weight: 500;
        color: var(--mute);
      }
      .chip {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        padding: 3px 8px;
        border: 1px solid var(--hair);
        background: var(--elevated);
        font-family: var(--font-mono);
        font-size: 10px;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        color: var(--mute);
      }
      .sheet {
        border-top: 1px solid var(--hair);
        background: var(--chrome);
        padding: 10px 12px 18px;
      }
      .sheet button.row {
        display: flex;
        width: 100%;
        align-items: center;
        gap: 10px;
        padding: 10px 4px;
        text-align: left;
        font-size: 15px;
      }
      .tool-row .dot {
        width: 6px;
        height: 6px;
        border-radius: 99px;
        background: var(--accent);
        animation: blink 1s steps(1) infinite;
      }
      .computer {
        overflow: hidden;
        border: 1px solid var(--hair);
        background: var(--elevated);
      }
      .computer-bar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 6px 10px;
        border-bottom: 1px solid var(--hair);
        background: var(--chrome);
        font-family: var(--font-mono);
        font-size: 10px;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: var(--dim);
      }
      .computer-bar span {
        display: inline-flex;
        align-items: center;
        gap: 6px;
      }
      .computer-screen {
        display: grid;
        place-items: center;
        height: 72px;
        font-family: var(--font-mono);
        font-size: 11px;
        color: var(--mute);
      }
      .attach-chip {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        margin-bottom: 6px;
        padding: 6px 10px;
        border: 1px solid var(--hair);
        background: var(--elevated);
        font-size: 13px;
      }
      .composer-hint {
        padding: 6px 10px 0;
        font-family: var(--font-mono);
        font-size: 10px;
        color: var(--dim);
      }
      .scrim {
        position: absolute;
        inset: 0;
        z-index: 10;
        background: color-mix(in srgb, #000 42%, transparent);
      }
      .bottom-sheet {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        z-index: 11;
        max-height: 74%;
        overflow: auto;
        padding: 0 16px 28px;
        border-top: 1px solid var(--hair);
        border-radius: 16px 16px 0 0;
        background: var(--chrome);
      }
      .grabber {
        width: 36px;
        height: 4px;
        margin: 8px auto 10px;
        border-radius: 99px;
        background: color-mix(in srgb, var(--ink) 22%, transparent);
      }
      .side-drawer {
        position: absolute;
        top: 0;
        right: 0;
        bottom: 0;
        z-index: 11;
        display: flex;
        width: min(300px, 86%);
        flex-direction: column;
        overflow: auto;
        border-left: 1px solid var(--hair);
        background: var(--chrome);
      }
      .config-row {
        display: flex;
        width: 100%;
        align-items: baseline;
        justify-content: space-between;
        gap: 12px;
        padding: 13px 0;
        border-bottom: 1px solid var(--hair);
        text-align: left;
      }

      @media (max-height: 960px) {
        .iphone-stage {
          transform: scale(0.86);
          transform-origin: top center;
          padding-bottom: 0;
        }
      }
    </style>
  </head>
  <body class="min-h-screen">
    <header class="sticky top-0 z-20 border-b hair bg-chrome/90 backdrop-blur-sm">
      <div class="mx-auto flex max-w-[1400px] flex-wrap items-end justify-between gap-4 px-5 py-4">
        <div>
          <p class="font-mono text-[11px] uppercase tracking-[0.18em] text-dim">Hermes Bot · prototypes</p>
          <h1 class="font-display text-2xl leading-none text-ink">iPhone skins</h1>
        </div>
        <div class="flex flex-wrap items-center gap-2">
          <div class="flex gap-1" id="theme-pills"></div>
          <div class="ml-2 flex gap-1 border-l hair pl-3" id="mode-pills"></div>
          <div class="ml-2 flex gap-1 border-l hair pl-3">
            <button type="button" data-layout="phone" class="layout-btn px-2.5 py-1 font-mono text-[11px] uppercase tracking-wider">
              iPhone
            </button>
            <button type="button" data-layout="desktop" class="layout-btn px-2.5 py-1 font-mono text-[11px] uppercase tracking-wider">
              Desktop
            </button>
          </div>
          <div class="ml-2 flex gap-1 border-l hair pl-3" id="config-pills"></div>
        </div>
      </div>
      <p id="theme-note" class="mx-auto max-w-[1400px] px-5 pb-3 font-mono text-[11px] leading-relaxed text-dim"></p>
    </header>

    <main class="mx-auto max-w-[1400px] px-5 py-6">
      <section class="mb-6 grid gap-3 sm:grid-cols-5" id="token-row"></section>

      <section id="stage" class="overflow-hidden border hair bg-chrome shadow-nous" style="border-radius: var(--radius)"></section>
    </main>

    <script>
      const THEMES = {
        portal: {
          label: "Portal",
          note: {
            light: "Default. Nous Blue / portal — cream #E8F2FD, ink #170D02, #0053FD. IBM Plex. 8px.",
            dark: "Portal inverted — #071018 field, #4D8BFF accent, ice text. Same type and 8px.",
          },
          tokens: {
            light: [
              ["bg", "#E8F2FD"],
              ["accent", "#0053FD"],
              ["ink", "#170D02"],
              ["radius", "8px"],
              ["type", "IBM Plex"],
            ],
            dark: [
              ["bg", "#071018"],
              ["accent", "#4D8BFF"],
              ["ink", "#E8F2FD"],
              ["radius", "8px"],
              ["type", "IBM Plex"],
            ],
          },
        },
        psyche: {
          label: "Psyche",
          note: {
            light: "Nous glass light — #F8FAFF, psyche ink #0E2766, #0053FD. IBM Plex + Instrument Serif. 4px.",
            dark: "Desktop psyche — cream #FFE6CB on #0E2766, #0053FD. IBM Plex. 4px.",
          },
          tokens: {
            light: [
              ["bg", "#F8FAFF"],
              ["accent", "#0053FD"],
              ["ink", "#0E2766"],
              ["radius", "4px"],
              ["type", "IBM Plex"],
            ],
            dark: [
              ["bg", "#081633"],
              ["accent", "#0053FD"],
              ["cream", "#FFE6CB"],
              ["radius", "4px"],
              ["type", "IBM Plex"],
            ],
          },
        },
        teal: {
          label: "Teal",
          note: {
            light: "Hermes Teal paper — #F6F1E6, ink #041C1C, deep teal accent. System + JetBrains. 8px.",
            dark: "Dashboard Hermes Teal — #041C1C, cream #FFE6CB as accent. 8px.",
          },
          tokens: {
            light: [
              ["bg", "#F6F1E6"],
              ["accent", "#0D4A44"],
              ["ink", "#041C1C"],
              ["radius", "8px"],
              ["type", "System / JBM"],
            ],
            dark: [
              ["bg", "#041C1C"],
              ["accent", "#FFE6CB"],
              ["glow", "#FFBD38"],
              ["radius", "8px"],
              ["type", "System / JBM"],
            ],
          },
        },
        mono: {
          label: "Mono",
          note: {
            light: "Research paper — #F4F4F4, black ink, 0 radius, IBM Plex.",
            dark: "Dashboard Mono — #0E0E0E, 0 radius, OUTPUT/SEED chrome.",
          },
          tokens: {
            light: [
              ["bg", "#F4F4F4"],
              ["accent", "#0E0E0E"],
              ["ink", "#0E0E0E"],
              ["radius", "0"],
              ["type", "IBM Plex"],
            ],
            dark: [
              ["bg", "#0E0E0E"],
              ["accent", "#EAEAEA"],
              ["card", "#161618"],
              ["radius", "0"],
              ["type", "IBM Plex"],
            ],
          },
        },
        ember: {
          label: "Ember",
          note: {
            light: "Forge paper — #FFF4EB, rust #C2410C. Newsreader + IBM Plex Mono. 4px.",
            dark: "Dashboard Ember — #1A0A06, bronze cream, #F97316. 4px.",
          },
          tokens: {
            light: [
              ["bg", "#FFF4EB"],
              ["accent", "#C2410C"],
              ["ink", "#1A0A06"],
              ["radius", "4px"],
              ["type", "Newsreader"],
            ],
            dark: [
              ["bg", "#1A0A06"],
              ["accent", "#F97316"],
              ["cream", "#FFD8B0"],
              ["radius", "4px"],
              ["type", "Newsreader"],
            ],
          },
        },
      };

      const BOTS = [

          btn.onclick = () => {

            <div class="px-4 py-3">
              <p class="font-mono text-[10px] uppercase tracking-[0.16em] text-dim">Routines</p>
              <p class="mt-1 text-sm text-ink">Docks only while Bots is active</p>
            </div>
            <button class="mx-3 border hair px-3 py-2 text-left" style="border-radius: var(--radius)">
              <p class="text-sm">Morning papers</p>
              <p class="font-mono text-[11px] text-dim">daily 07:00 · Atlas</p>
            </button>
          </aside>`;
      }

      function paint() {
        renderPills();
        renderTokens(document.documentElement.dataset.theme);
        const layout = document.documentElement.dataset.layout;
        const stage = document.getElementById("stage");
        const bot = BOTS.find((b) => b.id === selected);
        if (layout === "phone") {
          if (configOpen && configPlace === "screen") phoneSurface = "config";
          else if (phoneSurface === "config") phoneSurface = "chat";
          const inner =
            phoneSurface === "config"
              ? configScreen(bot)
              : phoneSurface === "chat"
                ? chatMobile()
                : rosterMobile();
          stage.innerHTML = iphone(inner);
        } else {
          const chatCol = configOpen && configPlace === "screen" ? configScreen(bot) : chat();
          const rail = configOpen && configPlace === "sidebar" ? configSidebar(bot) : routines();
          stage.innerHTML = `
            <div class="relative flex h-[720px]">
              ${roster(false)}
              ${chatCol}
              ${rail}
              ${configOverlay(bot)}
            </div>`;
        }
        stage.querySelectorAll("[data-bot]").forEach((el) => {
          el.onclick = () => {
            selected = el.dataset.bot;
            if (document.documentElement.dataset.layout === "phone") {
              phoneSurface = "chat";
              if (configPlace === "screen") configOpen = false;
            }
            paint();
          };
        });
        const back = document.getElementById("phone-back");
        if (back) {
          back.onclick = () => {
            phoneSurface = "roster";
            sheet = null;
            recording = false;
            configOpen = false;
            paint();
          };
        }
        const plus = document.getElementById("plus-btn");
        if (plus) {
          plus.onclick = () => {
            sheet = sheet === "attach" ? null : "attach";
            paint();
          };
        }
        const settings = document.getElementById("settings-btn");
        if (settings) {
          settings.onclick = () => {
            if (configOpen) closeConfig();
            else openConfig();
          };
        }
        const configBack = document.getElementById("config-back");
        if (configBack) configBack.onclick = closeConfig;
        const configClose = document.getElementById("config-close");
        if (configClose) configClose.onclick = closeConfig;
        const configScrim = document.getElementById("config-scrim");
        if (configScrim) configScrim.onclick = closeConfig;
        const closeSheet = document.getElementById("sheet-close");
        if (closeSheet) {
          closeSheet.onclick = () => {
            sheet = null;
            paint();
          };
        }
        const mic = document.getElementById("mic-btn");
        if (mic) {
          mic.onclick = () => {
            recording = !recording;
            if (recording) sheet = null;
            paint();
          };
        }
        const send = document.getElementById("send-btn");
        if (send) {
          send.onclick = () => {
            composerText = "";
            pendingAttach = null;
            sheet = null;
            paint();
          };
        }
        const attachFile = document.getElementById("attach-file");
        if (attachFile) {
          attachFile.onclick = () => {
            pendingAttach = "brief.pdf";
            sheet = null;
            paint();
          };
        }
        const attachPlugin = document.getElementById("attach-plugin");
        if (attachPlugin) {
          attachPlugin.onclick = () => {
            openConfig();
          };
        }
        const detach = document.getElementById("detach-btn");
        if (detach) {
          detach.onclick = () => {
            pendingAttach = null;
            paint();
          };
        }
        const input = document.getElementById("composer-input");
        if (input) {
          input.oninput = () => {
            const wasEmpty = !composerText.trim();
            composerText = input.value;
            const isEmpty = !composerText.trim();
            if (wasEmpty !== isEmpty && !recording) {
              restoreComposer = true;
              paint();
            }
          };
          if (restoreComposer) {
            input.focus();
            input.selectionStart = input.selectionEnd = input.value.length;
            restoreComposer = false;
          }
        }
      }

      paint();
    </script>
  </body>
</html>
